services:
  clipwell:
    build: .
    container_name: clipwell
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./downloads:/app/downloads
    environment:
      PORT: ${PORT:-3000}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/app/downloads}
      YT_DLP_JS_RUNTIME: ${YT_DLP_JS_RUNTIME:-node:/usr/local/bin/node}
